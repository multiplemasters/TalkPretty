<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script>
    /* Apply the saved or system theme before first paint to avoid a flash. */
    (function () {
      try {
        var t = localStorage.getItem('talkpretty-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
      document.documentElement.classList.add('js', 'preload');
    })();
  </script>
</head>
<body>
  {% include icons.html %}
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-text">
          <span class="brand-name">TalkPretty</span>
          <span class="brand-sub">{{ site.tagline }}</span>
        </span>
      </a>
      <div class="header-actions">
        <a class="btn btn-pill js-only" id="saved-link" href="{{ '/' | relative_url }}?saved=1" aria-label="Saved frameworks">
          <svg class="icon" aria-hidden="true"><use href="#i-star"/></svg>
          <span class="hide-sm">Saved</span>
          <span class="mono" id="saved-count">0</span>
        </a>
        <button class="btn btn-pill js-only" id="theme-toggle" type="button" aria-pressed="false" aria-label="Dark mode">
          <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          <span class="hide-sm">Dark mode</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <p>{{ site.frameworks.size }} frameworks. Acronym expansions vary by source; see the note on each page.</p>
      <p><a href="https://github.com/multiplemasters/TalkPretty">Source on GitHub</a></p>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
